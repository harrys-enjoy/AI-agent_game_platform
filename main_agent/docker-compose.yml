services:
  main-agent:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    environment:
      LIVE_AGENT_DISCOVERY: "true"
      AGENT_REGISTRY: "workmate-agent,video-agent,dev-agent,game-qna-agent"
      WORKMATE_AGENT_URL: "http://workmate-agent:8001/a2a"
      VIDEO_AGENT_URL: "http://video-agent:8002/a2a"
      DEV_AGENT_URL: "http://dev-agent:8003/a2a"
      GAME_QNA_AGENT_URL: "http://game-qa-agent:3000/message:send"
      WORKMATE_SERVICE_TOKEN: "${WORKMATE_SERVICE_TOKEN:?WORKMATE_SERVICE_TOKEN must be set}"
      VIDEO_SERVICE_TOKEN: "${VIDEO_SERVICE_TOKEN:-}"
      DEV_SERVICE_TOKEN: "${DEV_SERVICE_TOKEN:-}"
      GAME_QNA_SERVICE_TOKEN: "${GAME_QNA_SERVICE_TOKEN:-}"
      ROUTER_LLM_ENABLED: "${ROUTER_LLM_ENABLED:-false}"
      ROUTER_MODEL_NAME: "${ROUTER_MODEL_NAME:-}"
      ROUTER_BASE_URL: "${ROUTER_BASE_URL:-https://integrate.api.nvidia.com/v1}"
      ROUTER_API_KEY: "${ROUTER_API_KEY:-}"
      ROUTER_TIMEOUT_SECONDS: "${ROUTER_TIMEOUT_SECONDS:-8}"
    depends_on:
      workmate-agent:
        condition: service_healthy
      video-agent:
        condition: service_started
      dev-agent:
        condition: service_started

  workmate-agent:
    # 팀원(담당자) 요청 반영 - 실제 workmate-agent 소스를 이 저장소 안(workmate-agent/)에
    # vendoring해서 video/dev/qna_agent와 같은 방식으로 맞췄다. 이전엔 `../../workmate-agent`로
    # c:\dev\workmate\workmate-agent(로컬 전용 형제 폴더)를 참조했는데, 그 경로는 이 저장소만
    # clone한 사람에겐 존재하지 않아 build가 바로 실패했다 - 지금은 다시 `../workmate-agent`
    # 하나로 이 저장소 안쪽을 가리키므로 clone 한 번으로 빌드된다.
    build: ../workmate-agent
    # app.main:app 하나가 A2A(/a2a/*, 8001)와 REST(/api/v1/*) 라우터를 전부 같이 서빙한다
    # (workmate-agent/app/main.py의 include_router 전부 확인). 프론트엔드
    # (main_agent/frontend/src/workmate/api.ts의 WORKMATE_API_BASE_URL)는 브라우저에서 직접
    # http://127.0.0.1:8100을 호출하도록 하드코딩돼 있으므로, 컨테이너 내부 8001을 호스트
    # 8100으로 publish해야 오늘 브리핑/할 일 관리/회의/제안함 등 REST 화면이 동작한다 - 기존
    # expose(컨테이너 간 통신용, main-agent의 WORKMATE_AGENT_URL이 씀)는 그대로 유지.
    ports:
      - "8100:8001"
    expose: ["8001"]
    # OPENAI_API_KEY 등 실 Provider 자격 증명은 workmate-agent 자체 .env를
    # 그대로 재사용한다 - 이 Compose의 .env는 Main Agent 설정만 갖고 있다.
    env_file:
      - "../workmate-agent/.env"
    environment:
      WORKMATE_SERVICE_TOKEN: "${WORKMATE_SERVICE_TOKEN:?WORKMATE_SERVICE_TOKEN must be set}"
      APP_BASE_URL: "http://workmate-agent:8001/a2a"
      GOOGLE_CLIENT_SECRET_FILE: "/app/google-oauth-test/client_secret.json"
      # 컨테이너 안에서는 `Path(__file__).resolve().parents[3]` 기반 기본 토큰 경로 추정
      # (`app/workflows/daily_briefing.py`)이 리포 레이아웃과 안 맞아 항상 빗나간다.
      # google-oauth-test/token.json 자체는 지금 로컬에 없어서(disabled-for-test 파일만 있음)
      # 볼륨 마운트는 보류 - 준비되면 아래 volumes:에
      # `- "../google-oauth-test/token.json:/app/google-oauth-test/token.json"` 한 줄을 추가한다.
      GOOGLE_TOKEN_FILE: "/app/google-oauth-test/token.json"
    # `.runtime/`은 workmate-agent 저장소(vendored copy 포함)에서 항상 gitignore 대상이라
    # 컨테이너를 새로 띄우면 비어 있는 SQLite로 시작한다 - 이 저장소를 clone만 받은 사람에게는
    # 정상 동작(빈 상태로 시작)이다. 로컬에서 `python -m app.server`로 workmate-agent를 따로
    # 띄워 데이터를 쌓아온 사람이 그 데이터를 컨테이너와 공유하고 싶다면, 아래 경로를 자신의
    # 실제 workmate-agent 체크아웃(예: c:\dev\workmate\workmate-agent\.runtime)으로 바꿔서
    # 쓰면 된다 - 다만 그 경로는 각자 로컬에서만 유효하므로 이 파일에 커밋하지 않는다.
    volumes:
      - "../workmate-agent/.runtime:/app/.runtime"
      - "../workmate-agent/google-oauth-test:/app/google-oauth-test"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  video-agent:
    build: ../video_agent
    ports:
      - "8002:8002"
    # GEMINI_API_KEY / VEO_API_KEY / LTX_API_KEY / VIDEO_SERVICE_TOKEN all come
    # from .env. Host port is mapped (not just `expose`) so MEDIA_PUBLIC_BASE_URL
    # links (default http://localhost:8002) resolve from a browser, not just
    # container-to-container.
    env_file:
      - .env

  dev-agent:
    build: ../dev_agent
    expose: ["8003"]
    # env_file은 main_agent/.env 하나로 통합(dev_agent/.env는 더 이상 안 씀) — 아래 environment:에
    # 같은 키를 또 적으면 값이 비어있어도 그게 항상 이겨서 env_file 값을 덮어써버린다(실측 버그).
    env_file:
      - .env
    environment:
      DEFAULT_WORKSPACE_ID: "${DEFAULT_WORKSPACE_ID:-game-team-a}"

  game-qa-agent:
    build: "../qna_agent"
    expose: ["3000"]
    env_file:
      - "../qna_agent/.env"
    environment:
      PORT: "3000"
      AGENT_PUBLIC_URL: "http://game-qa-agent:3000"
      MAIN_AGENT_URL: "http://main-agent:8000"

  # Standalone GitHub dashboard (no API coupling with dev-agent) - iframed into
  # the Development Assistant tab's Workspace Preview. Remapped to host 8004
  # since main-agent already owns host 8000. Docker socket is intentionally
  # NOT mounted here (it grants effective host-root) - the dashboard's
  # deployment-status tab needs it, opt in later if that tab matters; see
  # dev_agent/docker-compose.yml's kosa-front service for the full version.
  kosa-front:
    build: ../dev_agent/kosa_front
    ports:
      - "8004:8000"
    env_file:
      - .env

networks:
  default:
    name: workmate-network
