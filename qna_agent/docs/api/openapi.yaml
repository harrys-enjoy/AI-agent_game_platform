openapi: 3.0.3
info:
  title: Game Q&A API
  version: 0.1.0
  description: 외부 업무생산성 서비스에서 호출하는 게임 개발 Q&A API
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: 연동 상태 확인
      responses:
        '200':
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: 토큰 절감 경로 지표 확인
      responses:
        '200':
          description: 프로세스 시작 후 누적된 호출 지표
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
  /sources:
    get:
      summary: CC0 콘텐츠 출처 목록 조회
      responses:
        '200':
          description: 공개 가능한 콘텐츠 출처와 라이선스 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
  /api/ask:
    post:
      summary: 게임 Q&A 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Q&A 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 지식 자료 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 모델 또는 원격 에이전트 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /a2a:
    post:
      summary: 전문 에이전트 호출
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AskRequest'
                - type: object
                  properties:
                    requestId:
                      type: string
                    evidence:
                      type: array
                      maxItems: 5
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
      responses:
        '200':
          description: AgentResponse
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AskResponse'
                  - type: object
                    properties:
                      confidence:
                        nullable: true
                        type: number
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /message:send:
    post:
      summary: A2A HTTP+JSON 동기 텍스트 메시지 전송
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [role, parts]
                  properties:
                    messageId:
                      type: string
                    contextId:
                      type: string
                    role:
                      type: string
                      enum: [ROLE_USER]
                    parts:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [text]
                        properties:
                          text:
                            type: string
                metadata:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [dev-guide, catalog, codex, lore]
                    context:
                      type: object
                    evidence:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: 완료된 A2A 에이전트 메시지
          content:
            application/a2a+json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: object
                    required: [messageId, role, parts]
                    properties:
                      messageId:
                        type: string
                      role:
                        type: string
                        enum: [ROLE_AGENT]
                      parts:
                        type: array
                        items:
                          type: object
                  properties:
                    text:
                      type: string
        '400':
          description: A2A 요청 검증 실패
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/A2AErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/A2AErrorResponse'
        '404':
          description: 요청 경로 또는 자료를 찾을 수 없음
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/A2AErrorResponse'
        '503':
          description: 모델 또는 원격 에이전트를 사용할 수 없음
          content:
            application/a2a+json:
              schema:
                $ref: '#/components/schemas/A2AErrorResponse'
components:
  schemas:
    AskRequest:
      type: object
      required: [mode, question]
      properties:
        mode:
          type: string
          enum: [dev-guide, catalog, codex, lore]
        question:
          type: string
          minLength: 1
          maxLength: 2000
        context:
          type: object
          additionalProperties: true
          properties:
            projectId:
              type: string
            userId:
              type: string
            workContext:
              type: string
              enum: [morning-briefing, in-progress]
    AskResponse:
      type: object
      required: [answer, mode, agent, sources, usage, requestId]
      properties:
        answer:
          type: string
        mode:
          type: string
        agent:
          type: string
        sources:
          type: array
          items:
            type: string
        usage:
          nullable: true
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
        requestId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNSUPPORTED_MODE, KNOWLEDGE_NOT_FOUND, MODEL_UNAVAILABLE, INTERNAL_ERROR, UNAUTHORIZED]
            message:
              type: string
            requestId:
              type: string
    A2AErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, status, message, details]
          properties:
            code:
              type: integer
            status:
              type: string
              enum: [INVALID_ARGUMENT, UNAUTHENTICATED, NOT_FOUND, UNAVAILABLE, INTERNAL]
            message:
              type: string
            details:
              type: array
              items:
                type: object
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: game-qna-api
    MetricsResponse:
      type: object
      required: [cacheHits, directKnowledgeResponses, agentCalls]
      properties:
        cacheHits:
          type: integer
        directKnowledgeResponses:
          type: integer
        agentCalls:
          type: integer
    Source:
      type: object
      required: [id, title, sourceUrl, license, licenseUrl, usage]
      properties:
        id:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
          format: uri
        license:
          type: string
          enum: [CC0]
        licenseUrl:
          type: string
          format: uri
        usage:
          type: string
    SourcesResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
