name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag game-qna-api:ci .
      - name: Run health check
        run: |
          set -e
          trap 'docker rm --force game-qna-api-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name game-qna-api-ci --publish 3000:3000 --env PORT=3000 game-qna-api:ci
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/health; then
            docker logs game-qna-api-ci
            exit 1
          fi
